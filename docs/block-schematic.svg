<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Arial, sans-serif">
  <rect width="1200" height="720" fill="white"/>
  <text x="600" y="40" text-anchor="middle" font-size="28" font-weight="bold">Smart Record Player - Current Architecture</text>

  <rect x="40" y="90" width="480" height="540" rx="16" fill="#eef7ff" stroke="#2474b5" stroke-width="2"/>
  <text x="280" y="125" text-anchor="middle" font-size="22" font-weight="bold">3D model / Raspberry Pi Pico 2 W</text>

  <text x="75" y="175" font-size="17" font-weight="bold">Inputs</text>
  <text x="95" y="205" font-size="15">BH1750 - I2C - tonearm light</text>
  <text x="95" y="235" font-size="15">HC-SR04 - digital - gesture/distance</text>
  <text x="95" y="265" font-size="15">Pushbutton - digital - NEXT / POWER</text>
  <text x="95" y="295" font-size="15">MCP3008 + potentiometer - SPI0 - volume</text>
  <text x="95" y="325" font-size="15">RC522 RFID - shared SPI0 - record tag</text>

  <text x="75" y="375" font-size="17" font-weight="bold">Outputs</text>
  <text x="95" y="405" font-size="15">SSD1306 OLED - SPI1 - local status</text>
  <text x="95" y="435" font-size="15">PWM LED - status feedback</text>
  <text x="95" y="465" font-size="15">28BYJ-48 + ULN2003 - platter motor</text>
  <text x="95" y="495" font-size="15">Onboard LED - status feedback</text>

  <rect x="110" y="535" width="340" height="60" rx="10" fill="white" stroke="#2474b5"/>
  <text x="280" y="562" text-anchor="middle" font-size="16" font-weight="bold">CircuitPython code.py</text>
  <text x="280" y="584" text-anchor="middle" font-size="14">WiFi + MQTT publish / subscribe</text>

  <rect x="680" y="140" width="460" height="410" rx="16" fill="#f7f3ff" stroke="#6b55b4" stroke-width="2"/>
  <text x="910" y="175" text-anchor="middle" font-size="22" font-weight="bold">Raspberry Pi 5</text>
  <text x="725" y="225" font-size="15">Mosquitto MQTT broker</text>
  <text x="725" y="260" font-size="15">record_player.py + state machine</text>
  <text x="725" y="295" font-size="15">Bluetooth audio via PipeWire</text>
  <text x="725" y="330" font-size="15">ThingSpeak integration</text>
  <text x="725" y="365" font-size="15">AI / fallback artist facts</text>

  <rect x="760" y="415" width="300" height="80" rx="10" fill="white" stroke="#6b55b4"/>
  <text x="910" y="447" text-anchor="middle" font-size="16" font-weight="bold">Player states</text>
  <text x="910" y="472" text-anchor="middle" font-size="14">STANDBY / REST / PLAY / PAUSED</text>

  <line x1="520" y1="330" x2="680" y2="330" stroke="#333" stroke-width="3"/>
  <polygon points="670,322 690,330 670,338" fill="#333"/>
  <polygon points="530,322 510,330 530,338" fill="#333"/>
  <text x="600" y="310" text-anchor="middle" font-size="16" font-weight="bold">MQTT over WiFi</text>

  <rect x="760" y="590" width="300" height="70" rx="12" fill="#fff8e8" stroke="#b68a1f"/>
  <text x="910" y="620" text-anchor="middle" font-size="16" font-weight="bold">Open before final demo</text>
  <text x="910" y="643" text-anchor="middle" font-size="13">stepper runtime + 3D mounting + final calibration</text>
</svg>
